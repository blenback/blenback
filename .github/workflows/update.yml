name: Update this repo's README

on:
  schedule:
    # once a day at 09:00 UTC
    - cron: "0 9 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: .github/scripts
        run: npm ci --no-audit --no-fund

      - name: Render README sections
        run: node .github/scripts/build-readme.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit if changed
        run: |
          git add -A README.md .github/assets
          if git diff --cached --quiet; then
            echo "No changes to the README or its generated art"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh README from profi and the site sources"
          git push
